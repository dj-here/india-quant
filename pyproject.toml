[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-quant"
version = "0.1.0"
description = "Institutional Market Prediction & Quantitative Trading Platform for Indian Equities and Derivatives (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Principal Quant & ML Team", email = "quant@indiaquant.internal" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<2.3.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "psycopg2-binary>=2.9.9",
    "jinja2>=3.1.3",
    "tabulate>=0.9.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "polars>=0.20.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
    "optuna>=3.6.0",
    "matplotlib>=3.8.0",
    "pyarrow>=15.0.0",
    "pandera>=0.18.0",
    "sqlalchemy>=2.0.28",
    "redis>=5.0.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]
deep = [
    "torch>=2.2.0",
    "pytorch-forecasting>=1.0.0",
    "pytorch-lightning>=2.2.0",
]
serving = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
]
mlops = [
    "mlflow>=2.11.0",
    "evidently>=0.4.19",
]
brokers = [
    "kiteconnect>=4.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
