version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusedge_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: campusedge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusedge_user
      POSTGRES_PASSWORD: campusedge_secure_password_2026
      POSTGRES_DB: campusedge_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusedge_user -d campusedge_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
