name: IndiaQuant CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Quant Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies and package in editable mode
        run: |
          pip install -e ".[dev,serving,mlops]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests

      - name: Run Mypy Static Type Checks
        run: |
          mypy src/india_quant/common src/india_quant/features src/india_quant/backtest

      - name: Run Strict Zero Look-Ahead Leakage Test Suite
        run: |
          pytest tests/test_leakage.py -v

      - name: Run Full Test Suite with Coverage
        run: |
          pytest --cov=india_quant --cov-report=term-missing tests/ -v
