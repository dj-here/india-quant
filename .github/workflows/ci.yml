name: KidsMentor CI Pipeline

on:
  push:
    branches: [ kidsmentor-main, main ]
  pull_request:
    branches: [ kidsmentor-main, main ]

jobs:
  backend-and-safety-evals:
    name: Backend API & AI Safety Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Database
        run: |
          python -m apps.api.seed.curriculum_seed
          python -m apps.api.seed.values_seed

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run 210-Case Adversarial Red-Team Safety & SymPy Harness
        run: |
          python evals/runner.py

      - name: Validate Background Worker Cycle
        run: |
          python -m apps.worker.worker
