name: PawStay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: pawstay_admin
          POSTGRES_PASSWORD: pawstay_secure_password
          POSTGRES_DB: pawstay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.15.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @pawstay/db generate
        env:
          DATABASE_URL: "postgresql://pawstay_admin:pawstay_secure_password@localhost:5432/pawstay_test"

      - name: Run Database Push / Migrations
        run: pnpm --filter @pawstay/db push
        env:
          DATABASE_URL: "postgresql://pawstay_admin:pawstay_secure_password@localhost:5432/pawstay_test"

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Unit & Integration Tests with Coverage
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://pawstay_admin:pawstay_secure_password@localhost:5432/pawstay_test"
          NEXTAUTH_SECRET: "test_secret_for_ci_environment_32chars"

      - name: Build Web & Worker
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://pawstay_admin:pawstay_secure_password@localhost:5432/pawstay_test"
          NEXTAUTH_SECRET: "test_secret_for_ci_environment_32chars"

      - name: Security Audit
        run: pnpm audit --prod --audit-level=high
